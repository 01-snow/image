<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한 장씩 스크롤 뷰어</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            height: 54px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #334155;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .folder-chips {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            height: 46px;
            flex-shrink: 0;
        }

        .folder-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
        }

        .chip.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            scroll-snap-type: y mandatory;
        }

        .feed-item {
            width: 100%;
            max-width: 800px;
            min-height: 70vh;
            max-height: 85vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            scroll-snap-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .feed-image-box {
            flex: 1;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .feed-image-box img {
            width: 100%;
            height: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }

        .spinner {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .feed-footer {
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .feed-footer span {
            color: var(--text-color);
            font-weight: 600;
        }

        .feed-footer a {
            color: #60a5fa;
            text-decoration: none;
            padding: 4px 10px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .text-container {
            flex: 1;
            display: none;
            padding: 16px;
            flex-direction: column;
            gap: 10px;
        }

        .text-container.active {
            display: flex;
        }

        textarea {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            width: 100%;
            max-height: 85vh;
            background-color: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal-backdrop.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background-color: var(--border);
            border-radius: 2px;
            align-self: center;
            margin-bottom: 4px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-header h2 {
            font-size: 1.15rem;
            color: #fff;
        }

        .close-sheet {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select, textarea.setting-textarea {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        textarea.setting-textarea {
            height: 60px;
            font-family: monospace;
            resize: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .btn-secondary {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerTitle">🖼️ 한 장씩 스크롤 뷰어</h1>
        <div class="header-btns">
            <button class="icon-btn" id="toggleViewBtn" title="보기 전환">📝</button>
            <button class="icon-btn" id="openSettingsBtn" title="설정">⚙️</button>
        </div>
    </header>

    <div class="folder-chips" id="folderChips"></div>

    <div class="workspace">
        <div class="feed-container" id="feedContainer"></div>
        <div class="text-container" id="textContainer">
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn-secondary" id="copyTextBtn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;">📋 링크 전체 복사</button>
            </div>
            <textarea id="urlTextArea" readonly></textarea>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div class="modal-backdrop" id="settingsModal">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2>⚙️ 폴더 및 설정</h2>
                <button class="close-sheet" id="closeSettingsBtn">&times;</button>
            </div>

            <div class="form-group">
                <label>기본 도메인 URL (이미지 링크)</label>
                <input type="text" id="domain" value="https://kimluna.uk/dorm/">
            </div>

            <div class="form-group">
                <label>1단계 폴더 (한글 이름:코드)</label>
                <textarea id="path1s" class="setting-textarea">윤재현:1yj</textarea>
            </div>

            <div class="form-group">
                <label>2단계 폴더 (하위폴더, 선택사항)</label>
                <textarea id="path2s" class="setting-textarea"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>시작 번호</label>
                    <input type="number" id="startNum" value="0">
                </div>
                <div class="form-group">
                    <label>끝 번호</label>
                    <input type="number" id="endNum" value="30">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>확장자</label>
                    <input type="text" id="ext" value=".png">
                </div>
                <div class="form-group">
                    <label>자릿수 패딩</label>
                    <select id="padding">
                        <option value="2" selected>2자리 (00, 01)</option>
                        <option value="1">없음 (0, 1)</option>
                        <option value="3">3자리 (000, 001)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>CORS 우회 프록시</label>
                <select id="proxy">
                    <option value="wsrv" selected>wsrv.nl (추천)</option>
                    <option value="direct">직접 로드</option>
                    <option value="corsproxy">corsproxy.io</option>
                </select>
            </div>

            <button class="btn-primary" id="applySettingsBtn">✨ 적용하기 & 닫기</button>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img id="lightboxImg" src="" alt="확대 이미지">
    </div>

    <script>
        try {
            const domainInput = document.getElementById('domain');
            const path1sInput = document.getElementById('path1s');
            const path2sInput = document.getElementById('path2s');
            const extInput = document.getElementById('ext');
            const proxySelect = document.getElementById('proxy');
            const startNumInput = document.getElementById('startNum');
            const endNumInput = document.getElementById('endNum');
            const paddingSelect = document.getElementById('padding');

            const settingsModal = document.getElementById('settingsModal');
            const openSettingsBtn = document.getElementById('openSettingsBtn');
            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            const applySettingsBtn = document.getElementById('applySettingsBtn');

            const toggleViewBtn = document.getElementById('toggleViewBtn');
            const feedContainer = document.getElementById('feedContainer');
            const textContainer = document.getElementById('textContainer');
            const urlTextArea = document.getElementById('urlTextArea');
            const copyTextBtn = document.getElementById('copyTextBtn');
            const folderChips = document.getElementById('folderChips');
            const headerTitle = document.getElementById('headerTitle');

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');

            let folderDataMap = {};
            let activeFolderKey = '';
            let isTextView = false;

            // 로컬 스토리지에서 설정 불러오기
            function loadSettings() {
                try {
                    if (localStorage.getItem('viewer_domain') !== null) domainInput.value = localStorage.getItem('viewer_domain');
                    if (localStorage.getItem('viewer_path1s') !== null) path1sInput.value = localStorage.getItem('viewer_path1s');
                    if (localStorage.getItem('viewer_path2s') !== null) path2sInput.value = localStorage.getItem('viewer_path2s');
                    if (localStorage.getItem('viewer_startNum') !== null) startNumInput.value = localStorage.getItem('viewer_startNum');
                    if (localStorage.getItem('viewer_endNum') !== null) endNumInput.value = localStorage.getItem('viewer_endNum');
                    if (localStorage.getItem('viewer_ext') !== null) extInput.value = localStorage.getItem('viewer_ext');
                    if (localStorage.getItem('viewer_padding') !== null) paddingSelect.value = localStorage.getItem('viewer_padding');
                    if (localStorage.getItem('viewer_proxy') !== null) proxySelect.value = localStorage.getItem('viewer_proxy');
                } catch (e) {
                    console.error("Load settings error:", e);
                }
            }

            // 로컬 스토리지에 설정 저장하기
            function saveSettings() {
                try {
                    localStorage.setItem('viewer_domain', domainInput.value);
                    localStorage.setItem('viewer_path1s', path1sInput.value);
                    localStorage.setItem('viewer_path2s', path2sInput.value);
                    localStorage.setItem('viewer_startNum', startNumInput.value);
                    localStorage.setItem('viewer_endNum', endNumInput.value);
                    localStorage.setItem('viewer_ext', extInput.value);
                    localStorage.setItem('viewer_padding', paddingSelect.value);
                    localStorage.setItem('viewer_proxy', proxySelect.value);
                } catch (e) {
                    console.error("Save settings error:", e);
                }
            }

            function formatNumber(num, pad) {
                let s = num.toString();
                while (s.length < pad) s = '0' + s;
                return s;
            }

            function hasKorean(text) {
                return /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text);
            }

            function parseListWithSmartAlias(rawText) {
                if (!rawText || rawText.trim() === '') return [{ name: '', code: '' }];
                const rawItems = rawText.split(/[\n,]+/)
                                       .map(p => p.trim())
                                       .filter(p => p.length > 0);
                
                if (rawItems.length === 0) return [{ name: '', code: '' }];

                return rawItems.map(item => {
                    let namePart = '';
                    let codePart = '';

                    if (item.includes(':')) {
                        const parts = item.split(':');
                        namePart = parts[0].trim();
                        codePart = parts.slice(1).join(':').trim();
                    } else if (item.includes('-')) {
                        const firstDashIdx = item.indexOf('-');
                        namePart = item.substring(0, firstDashIdx).trim();
                        codePart = item.substring(firstDashIdx + 1).trim();
                    }

                    if (namePart && codePart && hasKorean(namePart)) {
                        return {
                            name: namePart,
                            code: codePart.replace(/^\/+/, '').replace(/\/+$/, '')
                        };
                    }

                    const clean = item.replace(/^\/+/, '').replace(/\/+$/, '');
                    return { name: clean, code: clean };
                });
            }

            function buildData() {
                try {
                    const domain = domainInput ? domainInput.value.trim().replace(/\/+$/, '') : '';
                    const p1s = parseListWithSmartAlias(path1sInput ? path1sInput.value : '');
                    const p2s = parseListWithSmartAlias(path2sInput ? path2sInput.value : '');
                    const ext = extInput ? extInput.value.trim() : '.png';
                    const pad = paddingSelect ? parseInt(paddingSelect.value, 10) || 2 : 2;
                    
                    const start = startNumInput && startNumInput.value !== '' ? parseInt(startNumInput.value, 10) : 0;
                    const end = endNumInput && endNumInput.value !== '' ? parseInt(endNumInput.value, 10) : 30;

                    folderDataMap = {};
                    let allUrls = [];

                    if (!domain || p1s.length === 0) return;

                    let list1 = p1s;
                    let list2 = p2s.length > 0 && p2s[0].code !== '' ? p2s : [{ name: '', code: '' }];

                    list1.forEach(p1 => {
                        list2.forEach(p2 => {
                            let urlParts = [domain];
                            if (p1.code) urlParts.push(p1.code);
                            if (p2.code) urlParts.push(p2.code);
                            let folderPathStr = urlParts.join('/');

                            let folderLabel = [p1.name, p2.name].filter(Boolean).join(' / ') || 'Root';

                            let urls = [];
                            for (let i = start; i <= end; i++) {
                                let formattedNum = formatNumber(i, pad);
                                urls.push(`${folderPathStr}/${formattedNum}${ext}`);
                            }

                            folderDataMap[folderLabel] = urls;
                            allUrls = allUrls.concat(urls);
                        });
                    });

                    if (Object.keys(folderDataMap).length > 1) {
                        folderDataMap['[전체 통합]'] = allUrls;
                    }
                } catch (err) {
                    console.error("buildData error:", err);
                }
            }

            function renderChips() {
                if (!folderChips) return;
                folderChips.innerHTML = '';
                const keys = Object.keys(folderDataMap);
                if (keys.length === 0) return;

                if (!activeFolderKey || !folderDataMap[activeFolderKey]) {
                    activeFolderKey = keys[0];
                }

                keys.forEach(folderName => {
                    const chip = document.createElement('div');
                    chip.className = `chip ${activeFolderKey === folderName ? 'active' : ''}`;
                    chip.textContent = `${folderName === '[전체 통합]' ? '📂 ' : '📁 '}${folderName} (${folderDataMap[folderName].length})`;
                    chip.onclick = () => {
                        activeFolderKey = folderName;
                        renderChips();
                        renderContent();
                    };
                    folderChips.appendChild(chip);
                });
            }

            function getProcessedImageUrl(originalUrl) {
                const proxy = proxySelect ? proxySelect.value : 'wsrv';
                if (proxy === 'wsrv') {
                    return `https://wsrv.nl/?url=${encodeURIComponent(originalUrl)}&n=-1`;
                } else if (proxy === 'corsproxy') {
                    return `https://corsproxy.io/?${encodeURIComponent(originalUrl)}`;
                }
                return originalUrl;
            }

            function renderContent() {
                if (!feedContainer) return;
                const keys = Object.keys(folderDataMap);
                
                if (keys.length === 0) {
                    if (headerTitle) headerTitle.textContent = "🖼️ 한 장씩 스크롤 뷰어";
                    feedContainer.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:60px 20px; line-height: 1.6;">우측 상단 ⚙️ 버튼을 눌러 정보를 입력해주세요!</div>';
                    if (urlTextArea) urlTextArea.value = '';
                    return;
                }

                const urls = folderDataMap[activeFolderKey] || [];
                if (headerTitle) {
                    headerTitle.textContent = `🖼️ ${activeFolderKey}`;
                }

                feedContainer.innerHTML = '';

                urls.forEach((originalUrl, index) => {
                    const displayUrl = getProcessedImageUrl(originalUrl);
                    const item = document.createElement('div');
                    item.className = 'feed-item';
                    item.innerHTML = `
                        <div class="feed-image-box">
                            <div class="spinner"></div>
                            <img src="${displayUrl}" alt="img ${index+1}" loading="lazy" 
                                 onload="this.previousElementSibling.style.display='none';" 
                                 onerror="this.closest('.feed-item').remove();">
                        </div>
                        <div class="feed-footer">
                            <span>#${index+1} / ${urls.length} (${originalUrl.split('/').pop()})</span>
                            <a href="${originalUrl}" target="_blank">원본</a>
                        </div>
                    `;
                    
                    const imgBox = item.querySelector('.feed-image-box');
                    if (imgBox) {
                        imgBox.onclick = () => {
                            if (lightbox && lightboxImg) {
                                lightboxImg.src = displayUrl;
                                lightbox.classList.add('active');
                            }
                        };
                    }
                    
                    feedContainer.appendChild(item);
                });

                if (urlTextArea) {
                    urlTextArea.value = urls.join('\n');
                }
                feedContainer.scrollTop = 0;
            }

            if (openSettingsBtn && settingsModal) {
                openSettingsBtn.onclick = () => settingsModal.classList.add('active');
            }
            if (closeSettingsBtn && settingsModal) {
                closeSettingsBtn.onclick = () => settingsModal.classList.remove('active');
            }
            if (settingsModal) {
                settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.classList.remove('active'); };
            }

            if (applySettingsBtn && settingsModal) {
                applySettingsBtn.onclick = () => {
                    saveSettings(); // 설정 저장 기능 추가
                    settingsModal.classList.remove('active');
                    buildData();
                    renderChips();
                    renderContent();
                };
            }

            if (toggleViewBtn && feedContainer && textContainer) {
                toggleViewBtn.onclick = () => {
                    isTextView = !isTextView;
                    if (isTextView) {
                        feedContainer.style.display = 'none';
                        textContainer.classList.add('active');
                        toggleViewBtn.textContent = '🖼️';
                    } else {
                        feedContainer.style.display = 'flex';
                        textContainer.classList.remove('active');
                        toggleViewBtn.textContent = '📝';
                    }
                };
            }

            if (copyTextBtn && urlTextArea) {
                copyTextBtn.onclick = () => {
                    urlTextArea.select();
                    document.execCommand('copy');
                    alert('클립보드에 복사되었습니다!');
                };
            }

            if (lightbox && lightboxClose) {
                lightboxClose.onclick = () => lightbox.classList.remove('active');
                lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); };
            }

            // 1. 저장된 설정 불러오기
            loadSettings();

            // 2. 초기 실행
            buildData();
            renderChips();
            renderContent();

        } catch (globalErr) {
            console.error(globalErr);
        }
    </script>
</body>
</html>
