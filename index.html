<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한 장씩 스크롤 뷰어</title>
<style>
:root {
--bg-color: #0b0f19;
--card-bg: #1e293b;
--text-color: #f8fafc;
--text-secondary: #94a3b8;
--accent: #3b82f6;
--border: #334155;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
flex-direction: column;
height: 100vh;
overflow: hidden;
}

/* Top Header */
header {
background-color: var(--card-bg);
border-bottom: 1px solid var(--border);
padding: 10px 16px;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 10;
height: 54px;
flex-shrink: 0;
}

header h1 {
font-size: 1rem;
color: #fff;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
max-width: 240px;
}

.header-btns {
display: flex;
gap: 8px;
}

.icon-btn {
background: #334155;
color: white;
border: none;
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.9rem;
cursor: pointer;
}

/* Folder Chips Bar */
.folder-chips {
display: flex;
gap: 6px;
padding: 8px 12px;
background-color: var(--card-bg);
border-bottom: 1px solid var(--border);
overflow-x: auto;
white-space: nowrap;
scrollbar-width: none;
height: 46px;
flex-shrink: 0;
}

.folder-chips::-webkit-scrollbar {
display: none;
}

.chip {
background-color: #0f172a;
border: 1px solid var(--border);
color: var(--text-secondary);
padding: 4px 12px;
border-radius: 14px;
font-size: 0.8rem;
cursor: pointer;
transition: all 0.2s;
flex-shrink: 0;
display: inline-flex;
align-items: center;
}

.chip.active {
background-color: var(--accent);
border-color: var(--accent);
color: white;
font-weight: 600;
}

/* Workspace */
.workspace {
flex: 1;
display: flex;
flex-direction: column;
overflow: hidden;
position: relative;
}

/* Single Feed Scroll View */
.feed-container {
flex: 1;
overflow-y: auto;
padding: 16px;
display: flex;
flex-direction: column;
gap: 24px;
align-items: center;
scroll-snap-type: y mandatory;
}

.feed-item {
width: 100%;
max-width: 800px;
min-height: 70vh;
max-height: 85vh;
background-color: var(--card-bg);
border: 1px solid var(--border);
border-radius: 16px;
display: flex;
flex-direction: column;
overflow: hidden;
scroll-snap-align: center;
box-shadow: 0 8px 16px rgba(0,0,0,0.4);
flex-shrink: 0;
}

.feed-image-box {
flex: 1;
width: 100%;
background-color: #000;
display: flex;
align-items: center;
justify-content: center;
position: relative;
cursor: pointer;
overflow: hidden;
}

.feed-image-box img {
width: 100%;
height: 100%;
max-height: 75vh;
object-fit: contain;
display: block;
}

.spinner {
position: absolute;
width: 32px;
height: 32px;
border: 3px solid rgba(255,255,255,0.1);
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

.feed-footer {
padding: 12px 16px;
background-color: var(--card-bg);
border-top: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.85rem;
}

.feed-footer span {
color: var(--text-color);
font-weight: 600;
}

.feed-footer a {
color: #60a5fa;
text-decoration: none;
padding: 4px 10px;
background: #0f172a;
border-radius: 6px;
border: 1px solid var(--border);
font-size: 0.8rem;
}

/* Text View */
.text-container {
flex: 1;
display: none;
padding: 16px;
flex-direction: column;
gap: 10px;
}

.text-container.active {
display: flex;
}

textarea {
flex: 1;
background-color: var(--card-bg);
border: 1px solid var(--border);
color: var(--text-color);
padding: 12px;
border-radius: 8px;
font-family: monospace;
font-size: 0.85rem;
resize: none;
outline: none;
}

/* Bottom Sheet Modal */
.modal-backdrop {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
z-index: 100;
display: flex;
align-items: flex-end;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
}

.modal-backdrop.active {
opacity: 1;
pointer-events: auto;
}

.bottom-sheet {
width: 100%;
max-height: 85vh;
background-color: var(--card-bg);
border-top-left-radius: 20px;
border-top-right-radius: 20px;
padding: 20px;
display: flex;
flex-direction: column;
gap: 14px;
overflow-y: auto;
transform: translateY(100%);
transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
}

.modal-backdrop.active .bottom-sheet {
transform: translateY(0);
}

.sheet-handle {
width: 40px;
height: 4px;
background-color: var(--border);
border-radius: 2px;
align-self: center;
margin-bottom: 4px;
}

.sheet-header {
display: flex;
justify-content: space-between;
align-items: center;
}

.sheet-header h2 {
font-size: 1.15rem;
color: #fff;
}

.close-sheet {
background: none;
border: none;
color: var(--text-secondary);
font-size: 1.5rem;
cursor: pointer;
}

.form-group {
display: flex;
flex-direction: column;
gap: 6px;
}

label {
font-size: 0.8rem;
font-weight: 600;
color: var(--text-secondary);
}

input, select, textarea.setting-textarea {
background-color: #0f172a;
border: 1px solid var(--border);
color: var(--text-color);
padding: 10px 12px;
border-radius: 8px;
font-size: 0.9rem;
outline: none;
}

textarea.setting-textarea {
height: 60px;
font-family: monospace;
resize: none;
}

.btn-primary {
background-color: var(--accent);
color: white;
border: none;
padding: 12px;
border-radius: 8px;
font-weight: 600;
font-size: 0.95rem;
cursor
