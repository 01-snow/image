<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한 장씩 스크롤 뷰어 (한글 이름 매핑 지원)</title>
<style>
:root {
--bg-color: #0b0f19;
--card-bg: #1e293b;
--text-color: #f8fafc;
--text-secondary: #94a3b8;
--accent: #3b82f6;
--border: #334155;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
-webkit-tap-highlight-color: transparent;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
flex-direction: column;
height: 100vh;
overflow: hidden;
}

/* Top Header */
header {
background-color: var(--card-bg);
border-bottom: 1px solid var(--border);
padding: 10px 16px;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 10;
height: 54px;
}

header h1 {
font-size: 1rem;
color: #fff;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
max-width: 240px;
}

.header-btns {
display: flex;
gap: 8px;
}

.icon-btn {
background: #334155;
color: white;
border: none;
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.9rem;
cursor: pointer;
}

/* Folder Chips Bar */
.folder-chips {
display: flex;
gap: 6px;
padding: 8px 12px;
background-color: var(--card-bg);
border-bottom: 1px solid var(--border);
overflow-x: auto;
white-space: nowrap;
scrollbar-width: none;
height: 46px;
flex-shrink: 0;
}

.folder-chips::-webkit-scrollbar {
display: none;
}

.chip {
background-color: #0f172a;
border: 1px solid var(--border);
color: var(--text-secondary);
padding: 4px 12px;
border-radius: 14px;
font-size: 0.8rem;
cursor: pointer;
transition: all 0.2s;
flex-shrink: 0;
display: inline-flex;
align-items: center;
}

.chip.active {
background-color: var(--accent);
border-color: var(--accent);
color: white;
font-weight: 600;
}

/* Workspace */
.workspace {
flex: 1;
display: flex;
flex-direction: column;
overflow: hidden;
position: relative;
}

/* Single Feed Scroll View */
.feed-container {
flex: 1;
overflow-y: auto;
padding: 16px;
display: flex;
flex-direction: column;
gap: 24px;
align-items: center;
scroll-snap-type: y mandatory;
}

.feed-item {
width: 100%;
max-width: 800px;
min-height: 70vh;
max-height: 85vh;
background-color: var(--card-bg);
border: 1px solid var(--border);
border-radius: 16px;
display: flex;
flex-direction: column;
overflow: hidden;
scroll-snap-align: center;
box-shadow: 0 8px 16px rgba(0,0,0,0.4);
}

.feed-image-box {
flex: 1;
width: 100%;
background-color: #000;
display: flex;
align-items: center;
justify-content: center;
position: relative;
cursor: pointer;
overflow: hidden;
}

.feed-image-box img {
width: 100%;
height: 100%;
max-height: 75vh;
object-fit: contain;
display: block;
}

.spinner {
position: absolute;
width: 32px;
height: 32px;
border: 3px solid rgba(255,255,255,0.1);
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

.feed-footer {
padding: 12px 16px;
background-color: var(--card-bg);
border-top: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.85rem;
}

.feed-footer span {
color: var(--text-color);
font-weight: 600;
}

.feed-footer a {
color: #60a5fa;
text-decoration: none;
padding: 4px 10px;
background: #0f172a;
border-radius: 6px;
border: 1px solid var(--border);
font-size: 0.8rem;
}

/* Text View */
.text-container {
flex: 1;
display: none;
padding: 16px;
flex-direction: column;
gap: 10px;
}

.text-container.active {
display: flex;
}

textarea {
flex: 1;
background-color: var(--card-bg);
border: 1px solid var(--border);
color: var(--text-color);
padding: 12px;
border-radius: 8px;
font-family: monospace;
font-size: 0.85rem;
resize: none;
outline: none;
}

/* Bottom Sheet Modal */
.modal-backdrop {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
z-index: 100;
display: flex;
align-items: flex-end;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
}

.modal-backdrop.active {
opacity: 1;
pointer-events: auto;
}

.bottom-sheet {
width: 100%;
max-height: 85vh;
background-color: var(--card-bg);
border-top-left-radius: 20px;
border-top-right-radius: 20px;
padding: 20px;
display: flex;
flex-direction: column;
gap: 14px;
overflow-y: auto;
transform: translateY(100%);
transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
}

.modal-backdrop.active .bottom-sheet {
transform: translateY(0);
}

.sheet-handle {
width: 40px;
height: 4px;
background-color: var(--border);
border-radius: 2px;
align-self: center;
margin-bottom: 4px;
}

.sheet-header {
display: flex;
justify-content: space-between;
align-items: center;
}

.sheet-header h2 {
font-size: 1.15rem;
color: #fff;
}

.close-sheet {
background: none;
border: none;
color: var(--text-secondary);
font-size: 1.5rem;
cursor: pointer;
}

.form-group {
display: flex;
flex-direction: column;
gap: 6px;
}

label {
font-size: 0.8rem;
font-weight: 600;
color: var(--text-secondary);
}

input, select, textarea.setting-textarea {
background-color: #0f172a;
border: 1px solid var(--border);
color: var(--text-color);
padding: 10px 12px;
border-radius: 8px;
font-size: 0.9rem;
outline: none;
}

textarea.setting-textarea {
height: 60px;
font-family: monospace;
resize: none;
}

.btn-primary {
background-color: var(--accent);
color: white;
border: none;
padding: 12px;
border-radius: 8px;
font-weight: 600;
font-size: 0.95rem;
cursor: pointer;
text-align: center;
width: 100%;
}

.btn-secondary {
background-color: #334155;
color: white;
border: none;
padding: 10px;
border-radius: 8px;
font-weight: 600;
font-size: 0.9rem;
cursor: pointer;
text-align: center;
width: 100%;
}

/* Lightbox Fullscreen */
.lightbox {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.95);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
opacity: 0;
pointer-events: none;
transition: opacity 0.2s;
}

.lightbox.active {
opacity: 1;
pointer-events: auto;
}

.lightbox img {
max-width: 100%;
max-height: 100%;
object-fit: contain;
}

.lightbox-close {
position: absolute;
top: 16px;
right: 16px;
background: rgba(255,255,255,0.2);
color: white;
border: none;
width: 40px;
height: 40px;
border-radius: 50%;
font-size: 1.2rem;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
z-index: 1001;
}
</style>
</head>
<body>

<header>
<h1 id="headerTitle">🖼️ 한 장씩 스크롤 뷰어</h1>
<div class="header-btns">
<button class="icon-btn" id="toggleViewBtn" title="보기 전환">📝</button>
<button class="icon-btn" id="openSettingsBtn" title="설정">⚙️</button>
</div>
</header>

<div class="folder-chips" id="folderChips"></div>

<div class="workspace">
<div class="feed-container" id="feedContainer"></div>
<div class="text-container" id="textContainer">
<div style="display: flex; justify-content: flex-end;">
<button class="btn-secondary" id="copyTextBtn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;">📋 링크 전체 복사</button>
</div>
<textarea id="urlTextArea" readonly></textarea>
</div>
</div>

<div class="modal-backdrop" id="settingsModal">
<div class="bottom-sheet">
<div class="sheet-handle"></div>
<div class="sheet-header">
<h2>⚙️ 폴더 및 설정</h2>
<button class="close-sheet" id="closeSettingsBtn">×</button>
</div>

<div class="form-group">
<label>기본 도메인 URL</label>
<input type="text" id="domain" value="https://kimluna.uk/dorm/">
</div>

<div class="form-group">
<label>1단계 폴더 (한글 이름:코드일 때만 이름 적용)</label>
<textarea id="path1s" class="setting-textarea">윤재현:1yj, h-b</textarea>
</div>

<div class="form-group">
<label>2단계 폴더 (한글 이름:코드일 때만 이름 적용)</label>
<textarea id="path2s" class="setting-textarea"></textarea>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<div class="form-group">
<label>시작 번호</label>
<input type="number" id="startNum" value="0" min="0">
</div>
<div class="form-group">
<label>끝 번호</label>
<input type="number" id="endNum" value="30" min="0">
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<div class="form-group">
<label>확장자</label>
<input type="text" id="ext" value=".png">
</div>
<div class="form-group">
<label>자릿수 패딩</label>
<select id="padding">
<option value="2" selected>2자리 (00, 01)</option>
<option value="1">없음 (0, 1)</option>
<option value="3">3자리 (000, 001)</option>
</select>
</div>
</div>

<div class="form-group">
<label>CORS 우회 프록시</label>
<select id="proxy">
<option value="wsrv" selected>wsrv.nl (추천)</option>
<option value="direct">직접 로드</option>
<option value="corsproxy">corsproxy.io</option>
</select>
</div>

<button class="btn-primary" id="applySettingsBtn">✨ 적용하기 & 닫기</button>
</div>
</div>

<div class="lightbox" id="lightbox">
<button class="lightbox-close" id="lightboxClose">×</button>
<img id="lightboxImg" src="" alt="확대 이미지">
</div>

<script>

// 한글 포함 여부를 체크하는 정규식 (완성된 한글 및 자모음 포함)
function hasKorean(text) {
return /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text);
}

// 한글 이름:코드 또는 이름-코드 매핑 파싱 함수
function parseListWithSmartAlias(rawText) {
const rawItems = rawText.split(/[,\n]+/)
.map(p => p.trim())
.filter(p => p.length > 0);

return rawItems.map(item => {
let namePart = '';
let codePart = '';

if (item.includes(':')) {
const parts = item.split(':');
namePart = parts[0].trim();
codePart = parts.slice(1).join(':').trim();
} else if (item.includes('-')) {
const firstDashIdx = item.indexOf('-');
namePart = item.substring(0, firstDashIdx).trim();
codePart = item.substring(firstDashIdx + 1).trim();
}

// 구분자가 있고, 앞부분(이름)이 한글일 때만 분리 적용
if (namePart && codePart && hasKorean(namePart)) {
return {
name: namePart,
code: codePart.replace(/^/+/, '').replace(//+$`/, '')
};
}

// 한글이 아니거나 구분자가 없으면 전체 문자열을 그대로 코드이자 이름으로 사용 (예: h-b 등)
const clean = item.replace(/^/+/, '').replace(//+`$/, '');
return { name: clean, code: clean };
});
}
